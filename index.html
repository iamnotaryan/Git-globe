<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Globe</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="globeViz"></div>
    <div id="overlay" class="overlay">
      <div id="overlayMessage">Loading geographic data…</div>
    </div>
    <div id="status" class="status hidden" aria-live="polite">
      <span id="statusUpdating" class="status-updating"></span>
      <span id="statusState" class="status-state">LIVE</span>
      <span id="statusDetail"></span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
